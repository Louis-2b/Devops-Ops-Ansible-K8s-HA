# mysql-external-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mysql-external
  namespace: default
spec:
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql-external
  namespace: default
subsets:
  - addresses:
      - ip: "192.168.222.45" # Remplacez par l'IP de votre serveur Docker
    ports:
      - port: 3306
        protocol: TCP
