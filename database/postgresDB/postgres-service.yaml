apiVersion: v1
kind: Service

metadata:
  name: postgres-service
  namespace: database
  labels:
    app: postgres

spec:
  clusterIP: None  # Service headless pour StatefulSet
  selector:
    app: postgres

  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      name: postgres-port  # Bonne pratique : nommer le port
