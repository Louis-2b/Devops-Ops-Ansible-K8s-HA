# Un StatefulSet est idéal pour les bases de données car il garantit :
# - Un nom de pod stable et prévisible
# - Un stockage persistant associé à chaque pod
# - Un ordre de démarrage/arrêt contrôlé

apiVersion: apps/v1
kind: Deployment

metadata:
  name: pgadmin
  namespace: database
  labels:
    app: pgadmin

spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: pgadmin
  
  template:
    metadata:
      labels:
        app: pgadmin
    
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4  # Image officielle de pgAdmin
          
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@pgadmin.com"  # E-mail par défaut pour pgAdmin
            
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:  # Récupère le mot de passe depuis un Secret
                secretKeyRef:
                  name: postgres-secret  # Nom du Secret Kubernetes
                  key: password  # Clé dans le Secret
            
            - name: PGADMIN_LISTEN_PORT
              value: "80" # Port d'écoute interne de pgAdmin

          ports:
            - containerPort: 80  # Port correct pour pgAdmin
              name: pgadmin-port
