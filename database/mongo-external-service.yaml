# mongo-external-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mongo-external
  namespace: default
spec:
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
  type: ClusterIP    

---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongo-external
  namespace: default
subsets:
- addresses:
  - ip: "192.168.222.45"  # Même IP que ci-dessus
  ports:
  - port: 27017
    protocol: TCP
