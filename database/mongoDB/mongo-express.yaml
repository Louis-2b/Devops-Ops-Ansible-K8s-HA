apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: database
  labels:
    app: mongo-express

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  
  template:
    metadata:
      labels:
        app: mongo-express
    
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:latest

          ports:
            - containerPort: 8081
              name: mongo-exp-port
          
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:  
                secretKeyRef:
                  name: mongo-secret
                  key: mongo_adminusername 

            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:  
                secretKeyRef:
                  name: mongo-secret
                  key: mongo_adminpassword
            
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:  
                secretKeyRef:
                  name: mongo-secret
                  key: basicauth_username

            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:  
                secretKeyRef:
                  name: mongo-secret
                  key: basicauth_password

            - name: ME_CONFIG_MONGODB_SERVER
              valueFrom: 
                configMapKeyRef:
                  name: mongo-configmap
                  key: database_url

            - name: ME_CONFIG_MONGODB_PORT
              value: "27017"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
  namespace: database
  labels:
    app: mongo-express

spec:
  selector:
    app: mongo-express
  type: LoadBalancer

  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30000
      name: mongo-exp-port



          
