# postgres-external-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: development
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-external
  namespace: development
subsets:
  - addresses:
      - ip: "192.168.222.45"
    ports:
      - port: 5432
        protocol: TCP
