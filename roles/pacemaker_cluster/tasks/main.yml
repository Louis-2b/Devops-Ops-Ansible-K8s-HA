---
- name: Contrôler le mot de passe hacluster
  ansible.builtin.assert:
    that:
      - pacemaker_hacluster_password | length >= 12
    fail_msg: >-
      pacemaker_hacluster_password est vide ou trop court (12 caractères minimum).
      Renseignez vault_hacluster_password dans inventories/production/group_vars/all/vault.yml.
    quiet: true
  tags: [pacemaker, always]

- name: Installer dnf-plugins-core (commande config-manager)
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  tags: [pacemaker, repo]

- name: Activer le dépôt High Availability
  community.general.dnf_config_manager:
    name:
      - "{{ pacemaker_ha_repo }}"
    state: enabled
  tags: [pacemaker, repo]

- name: Installer Pacemaker, PCS et Corosync
  ansible.builtin.dnf:
    name: "{{ pacemaker_packages }}"
    state: present
    update_cache: true
  tags: [pacemaker, packages]

- name: Définir le mot de passe du compte hacluster
  ansible.builtin.user:
    name: hacluster
    password: "{{ pacemaker_hacluster_password | password_hash('sha512', pacemaker_hacluster_salt) }}"
    update_password: always
  no_log: true
  tags: [pacemaker, users]

- name: Activer et démarrer pcsd
  ansible.builtin.systemd:
    name: pcsd
    enabled: true
    state: started
  tags: [pacemaker, service]

- name: Vérifier si le cluster existe déjà
  ansible.builtin.stat:
    path: /etc/corosync/corosync.conf
  register: pacemaker_corosync_conf
  tags: [pacemaker, cluster]

- name: Créer le cluster (depuis le nœud principal)
  when:
    - inventory_hostname == pacemaker_primary
    - not pacemaker_corosync_conf.stat.exists
  tags: [pacemaker, cluster]
  block:
    # Le mot de passe est passé en argument à pcs : il est brièvement visible dans la
    # liste des processus du nœud principal (pcs ne propose pas d'alternative non interactive).
    - name: Authentifier les nœuds auprès de pcsd
      ansible.builtin.command:
        argv: "{{ ['pcs', 'host', 'auth'] + pacemaker_node_args + ['-u', 'hacluster', '-p', pacemaker_hacluster_password] }}"
      changed_when: true
      no_log: true

    - name: Initialiser et démarrer le cluster
      ansible.builtin.command:
        argv: "{{ ['pcs', 'cluster', 'setup', pacemaker_cluster_name] + pacemaker_node_args + ['--start', '--enable'] }}"
      changed_when: true

- name: Attendre que les deux nœuds soient en ligne
  ansible.builtin.command: pcs status nodes
  register: pacemaker_nodes
  until: pacemaker_nodes.rc == 0 and ((pacemaker_nodes.stdout | regex_findall('Online:.*')) | length > 0)
  retries: 12
  delay: 5
  changed_when: false
  when: inventory_hostname == pacemaker_primary
  tags: [pacemaker, cluster]

- name: Appliquer les propriétés du cluster (STONITH, politique de quorum)
  ansible.builtin.command: >-
    pcs property set
    stonith-enabled={{ pacemaker_stonith_enabled | bool | lower }}
    no-quorum-policy={{ pacemaker_no_quorum_policy }}
  # « pcs property set » est idempotent mais ne signale pas s'il a modifié quelque chose.
  changed_when: false
  when: inventory_hostname == pacemaker_primary
  tags: [pacemaker, properties]
