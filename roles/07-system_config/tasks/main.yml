---
- name: Copier le script system_config.sh
  ansible.builtin.copy:
    src: system_config.sh
    dest: /tmp/system_config.sh
    mode: '0755'
  tags: 
    - system_config

- name: Exécuter system_config.sh
  ansible.builtin.command: /tmp/system_config.sh
  tags: 
    - system_config

- name: Supprimer le script system_config.sh
  ansible.builtin.file:
    path: /tmp/system_config.sh
    state: absent  
  tags: 
    - system_config