---
# Variables de boucle : k8s_rbac_sa (name, namespace, token_secret, roles[])
- name: "{{ k8s_rbac_sa.name }} - créer le ServiceAccount"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_rbac_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ k8s_rbac_sa.name }}"
        namespace: "{{ k8s_rbac_sa.namespace }}"

- name: "{{ k8s_rbac_sa.name }} - créer le secret de jeton longue durée"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_rbac_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ k8s_rbac_sa.token_secret }}"
        namespace: "{{ k8s_rbac_sa.namespace }}"
        annotations:
          kubernetes.io/service-account.name: "{{ k8s_rbac_sa.name }}"
      type: kubernetes.io/service-account-token

- name: "{{ k8s_rbac_sa.name }} - créer les Roles"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_rbac_kubeconfig }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ k8s_rbac_sa.namespace }}"
      rules: "{{ item.rules }}"
  loop: "{{ k8s_rbac_sa.roles | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: "{{ k8s_rbac_sa.name }} - créer les RoleBindings"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_rbac_kubeconfig }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ item.binding }}"
        namespace: "{{ k8s_rbac_sa.namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: "{{ item.name }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ k8s_rbac_sa.name }}"
          namespace: "{{ k8s_rbac_sa.namespace }}"
  loop: "{{ k8s_rbac_sa.roles | default([]) }}"
  loop_control:
    label: "{{ item.binding }}"

- name: "{{ k8s_rbac_sa.name }} - lire le jeton"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_rbac_kubeconfig }}"
    kind: Secret
    namespace: "{{ k8s_rbac_sa.namespace }}"
    name: "{{ k8s_rbac_sa.token_secret }}"
  register: k8s_rbac_sa_secret
  until: >-
    k8s_rbac_sa_secret.resources | length > 0 and
    k8s_rbac_sa_secret.resources[0].data.token is defined
  retries: 12
  delay: 5
  no_log: true

- name: "{{ k8s_rbac_sa.name }} - créer le dossier d'artefacts (poste de contrôle)"
  ansible.builtin.file:
    path: "{{ k8s_rbac_artifacts_dir }}/serviceaccounts"
    state: directory
    mode: "0700"
  delegate_to: localhost
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  become: false

- name: "{{ k8s_rbac_sa.name }} - générer le kubeconfig (poste de contrôle)"
  ansible.builtin.template:
    src: serviceaccount.kubeconfig.j2
    dest: "{{ k8s_rbac_artifacts_dir }}/serviceaccounts/{{ k8s_rbac_sa.name }}.kubeconfig"
    mode: "0600"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    k8s_rbac_sa_token: "{{ k8s_rbac_sa_secret.resources[0].data.token | b64decode }}"
  delegate_to: localhost
  become: false
  no_log: true
