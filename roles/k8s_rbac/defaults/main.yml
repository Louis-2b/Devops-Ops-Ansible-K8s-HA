---
k8s_rbac_kubeconfig: /etc/kubernetes/admin.conf
k8s_rbac_api_server: "https://{{ k8s_control_plane_endpoint }}"
k8s_rbac_cluster_name: "{{ k8s_cluster_name | default('kubernetes') }}"

# Les clés privées, certificats et kubeconfig générés sont écrits sur le POSTE DE
# CONTRÔLE Ansible (jamais commités : le dossier artifacts/ est ignoré par git).
k8s_rbac_artifacts_dir: "{{ playbook_dir }}/../artifacts/rbac"

k8s_rbac_cluster_roles: []
k8s_rbac_users: []
k8s_rbac_service_accounts: []

# Vérification des droits effectifs (équivalent de check_*_permissions.sh).
k8s_rbac_verify: false
k8s_rbac_verify_resources: [pods, services, deployments, statefulsets]
k8s_rbac_verify_verbs: [get, list, create, update, delete]
k8s_rbac_verify_namespaces: [default, kube-system]
