---
argument_specs:
  main:
    short_description: Prérequis système de Kubernetes.
    description:
      - Désactive le swap, charge les modules noyau, applique les sysctl, règle SELinux (Rocky), installe les paquets réseau et la synchronisation horaire,
        ouvre les ports communs avec firewalld.
      - À appliquer sur tous les nœuds Kubernetes (control planes et workers).
    options:
      kubernetes_pod_cidr:
        type: str
        description: Réseau des pods (CIDR). Placé dans la zone firewalld trusted ; identique à celui de control_plane et cni.
        default: 10.244.0.0/16
      kubernetes_service_cidr:
        type: str
        description: Réseau des services (CIDR). Placé dans la zone firewalld trusted ; identique à celui de control_plane.
        default: 10.96.0.0/12
      prerequisites_time_sync_manage:
        type: bool
        description: Installer et activer chrony.
        default: true
      prerequisites_selinux_state:
        type: str
        description: État SELinux sur Rocky (sans effet sur Debian).
        default: permissive
        choices:
          - permissive
          - enforcing
          - disabled
      prerequisites_kernel_modules:
        type: list
        description: Modules noyau chargés et rendus persistants.
        default:
          - overlay
          - br_netfilter
        elements: str
      prerequisites_sysctl:
        type: dict
        description: Paramètres sysctl appliqués.
        default:
          net.bridge.bridge-nf-call-iptables: 1
          net.bridge.bridge-nf-call-ip6tables: 1
          net.ipv4.ip_forward: 1
          fs.inotify.max_user_instances: 8192
          fs.inotify.max_user_watches: 524288
      prerequisites_firewall_manage:
        type: bool
        description: Gérer firewalld (installation, ports, zone trusted). Par défaut true sur Rocky, false sur Debian.
        default: '{{ ansible_facts[''os_family''] == ''RedHat'' }}'
      prerequisites_firewall_zone:
        type: str
        description: Zone firewalld à configurer ; vide = zone par défaut.
        default: ''
      prerequisites_firewall_ports:
        type: list
        description: Ports ouverts sur tous les nœuds (kubelet, VXLAN Flannel).
        default:
          - 10250/tcp
          - 8472/udp
        elements: str
