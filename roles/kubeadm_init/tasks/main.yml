---
- name: Vérifier si le cluster est déjà initialisé
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_admin_conf
  tags: [kubeadm_init]

- name: Déployer la configuration kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kubeadm_init_config_path }}"
    owner: root
    group: root
    mode: "0600"
  tags: [kubeadm_init]

- name: Vérifier que la VIP du control plane répond
  ansible.builtin.wait_for:
    host: "{{ k8s_control_plane_vip }}"
    port: "{{ k8s_control_plane_port }}"
    timeout: 30
  when: not kubeadm_init_admin_conf.stat.exists
  tags: [kubeadm_init]

- name: Initialiser le cluster Kubernetes
  ansible.builtin.command: kubeadm init --config {{ kubeadm_init_config_path }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init_result
  tags: [kubeadm_init]

- name: Attendre que l'API soit prête (via la VIP)
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
  register: kubeadm_init_readyz
  until: kubeadm_init_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  tags: [kubeadm_init]

- name: Rechercher le répertoire personnel de l'utilisateur d'administration
  ansible.builtin.getent:
    database: passwd
    key: "{{ kubeadm_init_kubeconfig_user }}"
  tags: [kubeadm_init, kubeconfig]

- name: Créer ~/.kube
  ansible.builtin.file:
    path: "{{ getent_passwd[kubeadm_init_kubeconfig_user][4] }}/.kube"
    state: directory
    owner: "{{ kubeadm_init_kubeconfig_user }}"
    mode: "0700"
  tags: [kubeadm_init, kubeconfig]

- name: Installer le kubeconfig administrateur
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ getent_passwd[kubeadm_init_kubeconfig_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ kubeadm_init_kubeconfig_user }}"
    mode: "0600"
  tags: [kubeadm_init, kubeconfig]
