---
common_set_hostname: true
common_timezone: ""
common_upgrade_packages: false
common_reboot_if_required: false
common_reboot_timeout: 900

common_packages:
  - vim-enhanced
  - tree
  - net-tools
  - telnet
  - git
  - nmap-ncat
  - bash-completion
  - tar
  - curl
  - chrony

# Durcissement SSH. Exécuter playbooks/00-bootstrap.yml AVANT d'activer
# (la clé SSH d'Ansible doit être en place, sinon l'accès est perdu).
common_ssh_password_authentication: false
common_ssh_permit_root_login: false
