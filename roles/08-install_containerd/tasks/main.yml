---
- name: Copier le script install_containerd.sh
  ansible.builtin.copy:
    src: install_containerd.sh
    dest: /tmp/install_containerd.sh
    mode: '0755'
  tags: 
    - install_containerd

- name: Exécuter install_containerd.sh
  ansible.builtin.command: /tmp/install_containerd.sh
  tags: 
    - install_containerd

- name: Supprimer le script install_containerd.sh
  ansible.builtin.file:
    path: /tmp/install_containerd.sh
    state: absent  
  tags: 
    - install_containerd