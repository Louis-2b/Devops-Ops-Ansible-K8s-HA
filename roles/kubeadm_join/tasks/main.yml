---
# À exécuter sur les nœuds qui doivent rejoindre le cluster (control plane n°2..N et workers).
# Les jetons sont générés à la demande sur le premier nœud du control plane et ne
# sont jamais stockés : durée de vie courte, aucune donnée sensible persistée.
- name: Vérifier si le nœud fait déjà partie du cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeadm_join_kubelet_conf
  tags: [kubeadm_join]

- name: Rejoindre le cluster
  when: not kubeadm_join_kubelet_conf.stat.exists
  tags: [kubeadm_join]
  block:
    - name: Créer un jeton de jonction temporaire
      ansible.builtin.command: kubeadm token create --ttl {{ kubeadm_join_token_ttl }}
      delegate_to: "{{ k8s_first_control_plane }}"
      register: kubeadm_join_token
      changed_when: true
      no_log: true

    - name: Calculer l'empreinte de la CA du cluster
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
          | openssl rsa -pubin -outform der 2>/dev/null \
          | openssl dgst -sha256 -hex | sed 's/^.* //'
      args:
        executable: /bin/bash
      delegate_to: "{{ k8s_first_control_plane }}"
      register: kubeadm_join_ca_hash
      changed_when: false

    - name: Générer une clé de certificat (nœuds control plane)
      ansible.builtin.command: kubeadm certs certificate-key
      delegate_to: "{{ k8s_first_control_plane }}"
      register: kubeadm_join_certificate_key
      changed_when: false
      no_log: true
      when: inventory_hostname in groups['control_plane']

    - name: Téléverser les certificats du control plane (valables 2 h)
      ansible.builtin.command: >-
        kubeadm init phase upload-certs --upload-certs
        --certificate-key {{ kubeadm_join_certificate_key.stdout }}
      delegate_to: "{{ k8s_first_control_plane }}"
      changed_when: true
      no_log: true
      when: inventory_hostname in groups['control_plane']

    - name: Déployer la configuration de jonction
      ansible.builtin.template:
        src: kubeadm-join.yaml.j2
        dest: "{{ kubeadm_join_config_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Exécuter kubeadm join
      ansible.builtin.command: kubeadm join --config {{ kubeadm_join_config_path }}
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: kubeadm_join_result

  always:
    - name: Supprimer la configuration de jonction (contient le jeton)
      ansible.builtin.file:
        path: "{{ kubeadm_join_config_path }}"
        state: absent
