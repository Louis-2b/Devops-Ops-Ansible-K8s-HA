---
- name: Vérifier que ce nœud est un control plane initialisé
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: cni_admin_conf

- name: Refuser de s'exécuter hors d'un control plane initialisé
  ansible.builtin.assert:
    that: cni_admin_conf.stat.exists
    fail_msg: "/etc/kubernetes/admin.conf est absent : exécutez ce rôle sur un control plane après kubeadm init."
    quiet: true

- name: Créer le répertoire des manifestes
  ansible.builtin.file:
    path: "{{ cni_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Télécharger le manifeste Flannel (version épinglée)
  ansible.builtin.get_url:
    url: "{{ cni_flannel_manifest_url }}"
    dest: "{{ cni_manifest_dir }}/kube-flannel-{{ cni_flannel_version }}.yml"
    checksum: "{{ cni_flannel_manifest_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0640"

- name: Aligner le réseau des pods sur le CIDR du cluster
  ansible.builtin.replace:
    path: "{{ cni_manifest_dir }}/kube-flannel-{{ cni_flannel_version }}.yml"
    regexp: '"Network":\s*"[0-9./]+"'
    replace: '"Network": "{{ kubernetes_pod_cidr }}"'
    mode: "0640"

- name: Appliquer le manifeste Flannel
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply
    -f {{ cni_manifest_dir }}/kube-flannel-{{ cni_flannel_version }}.yml
  register: cni_apply
  changed_when: "'created' in cni_apply.stdout or 'configured' in cni_apply.stdout"

- name: Attendre que Flannel soit déployé sur les nœuds
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-flannel
    rollout status daemonset/kube-flannel-ds --timeout={{ cni_rollout_timeout }}
  changed_when: false
