---
- name: Copier le script haproxy1_ssh_keys.sh
  ansible.builtin.copy:
    src: haproxy1_ssh_keys.sh
    dest: /tmp/haproxy1_ssh_keys.sh
    mode: "0755"
  tags:
    - haproxy1_ssh_keys

- name: Exécuter haproxy1_ssh_keys.sh
  ansible.builtin.command: /tmp/haproxy1_ssh_keys.sh
  tags:
    - haproxy1_ssh_keys

- name: Supprimer le script haproxy1_ssh_keys.sh
  ansible.builtin.file:
    path: /tmp/haproxy1_ssh_keys.sh
    state: absent
  tags:
    - haproxy1_ssh_keys
