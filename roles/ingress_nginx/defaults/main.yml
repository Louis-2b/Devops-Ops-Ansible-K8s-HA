---
# ⚠ ingress-nginx est RETIRÉ par le projet Kubernetes depuis mars 2026 : plus de
# correctifs de sécurité. Ce rôle le conserve pour reproduire l'installation existante ;
# prévoir la migration vers Gateway API ou un autre contrôleur (voir README).
ingress_nginx_chart_version: "4.15.1"
ingress_nginx_repo_url: https://kubernetes.github.io/ingress-nginx
ingress_nginx_namespace: ingress-nginx
ingress_nginx_release: ingress-nginx
ingress_nginx_kubeconfig: /etc/kubernetes/admin.conf
ingress_nginx_replicas: 3
ingress_nginx_wait_timeout: 10m

# Valeurs Helm supplémentaires, fusionnées (récursivement) avec les valeurs ci-dessous.
ingress_nginx_extra_values: {}
