---
- name: Ajouter le dépôt Docker CE (source de containerd.io)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "{{ containerd_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ containerd_repo_gpgkey }}"
    enabled: true
  tags: [containerd, repo]

- name: Installer containerd
  ansible.builtin.dnf:
    name: "containerd.io{{ '-' ~ containerd_package_version if containerd_package_version | length > 0 else '' }}"
    state: present
    update_cache: true
  notify: Restart containerd
  tags: [containerd, packages]

- name: Créer le répertoire de configuration de containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [containerd, config]

- name: Générer la configuration par défaut de containerd
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false
  check_mode: false
  tags: [containerd, config]

- name: Adapter la configuration pour Kubernetes (cgroups systemd)
  ansible.builtin.set_fact:
    containerd_config_content: >-
      {{ containerd_default_config.stdout
         | regex_replace('SystemdCgroup\\s*=\\s*false', 'SystemdCgroup = true') }}
  tags: [containerd, config]

- name: Épingler l'image sandbox (pause) si demandé
  ansible.builtin.set_fact:
    containerd_config_content: >-
      {{ containerd_config_content
         | regex_replace('^(\\s*sandbox(?:_image)?\\s*=\\s*).*$',
                         '\\1"' ~ containerd_sandbox_image ~ '"', multiline=True) }}
  when: containerd_sandbox_image | length > 0
  tags: [containerd, config]

- name: Écrire /etc/containerd/config.toml
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_config_content }}\n"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart containerd
  tags: [containerd, config]

- name: Configurer crictl
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      runtime-endpoint: {{ containerd_socket }}
      image-endpoint: {{ containerd_socket }}
  tags: [containerd, config]

- name: Activer et démarrer containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
  tags: [containerd, service]

- name: Appliquer immédiatement les changements de configuration
  ansible.builtin.meta: flush_handlers
