---
argument_specs:
  main:
    short_description: Workers kubeadm.
    description:
      - Joint les workers à un cluster dont le premier control plane est initialisé (jeton temporaire généré à la demande).
      - Dépend de prerequisites, container_runtime et packages.
    options:
      kubernetes_api_endpoint:
        type: str
        description: Adresse stable de l'API « hôte:port » (VIP, nom DNS ou équilibreur externe). Immuable après kubeadm init.
        required: true
      kubernetes_control_plane_group:
        type: str
        description: Groupe d'inventaire des control planes.
        default: control_plane
      kubernetes_primary_control_plane:
        type: str
        description: Nœud qui exécute kubeadm init.
        default: '{{ groups[kubernetes_control_plane_group] | sort | first }}'
      worker_node_ip:
        type: str
        description: Adresse du nœud dans le cluster.
        default: '{{ kubernetes_node_ip | default(ansible_facts[''default_ipv4''][''address'']) }}'
      worker_token_ttl:
        type: str
        description: Durée de vie du jeton de jonction.
        default: 30m
      worker_firewall_ports:
        type: list
        description: Ports ouverts sur les workers (plage NodePort).
        default:
          - 30000-32767/tcp
        elements: str
