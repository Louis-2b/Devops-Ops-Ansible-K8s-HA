---
- name: Copier le script config_firewall_haproxy.sh
  ansible.builtin.copy:
    src: config_firewall_haproxy.sh
    dest: /tmp/config_firewall_haproxy.sh
    mode: '0755'
  tags: 
    - config_firewall_haproxy

- name: Exécuter config_firewall_haproxy.sh
  ansible.builtin.command: /tmp/config_firewall_haproxy.sh
  tags: 
    - config_firewall_haproxy

- name: Supprimer le script config_firewall_haproxy.sh
  ansible.builtin.file:
    path: /tmp/config_firewall_haproxy.sh
    state: absent 
  tags: 
  - config_firewall_haproxy 