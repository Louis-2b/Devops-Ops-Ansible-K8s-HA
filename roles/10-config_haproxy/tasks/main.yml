---
- name: Copier le script config_haproxy.sh
  ansible.builtin.copy:
    src: config_haproxy.sh
    dest: /tmp/config_haproxy.sh
    mode: '0755'
  tags: 
    - config_haproxy

- name: Exécuter config_haproxy.sh
  ansible.builtin.command: /tmp/config_haproxy.sh
  tags: 
    - config_haproxy

- name: Supprimer le script config_haproxy.sh
  ansible.builtin.file:
    path: /tmp/config_haproxy.sh
    state: absent  
  tags: 
    - config_haproxy