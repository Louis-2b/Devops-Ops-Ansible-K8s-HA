---
- name: Copier le script install_ha_tools.sh
  ansible.builtin.copy:
    src: install_ha_tools.sh
    dest: /tmp/install_ha_tools.sh
    mode: "0755"
  tags:
    - install_ha_tools

- name: Exécuter install_ha_tools.sh
  ansible.builtin.command: /tmp/install_ha_tools.sh
  tags:
    - install_ha_tools

- name: Supprimer le script install_ha_tools.sh
  ansible.builtin.file:
    path: /tmp/install_ha_tools.sh
    state: absent
  tags:
    - install_ha_tools
