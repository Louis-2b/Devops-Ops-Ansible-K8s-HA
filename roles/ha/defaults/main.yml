---
# --- À renseigner ----------------------------------------------------------------------------
# Adresse IP virtuelle (VIP) de l'API Kubernetes, libre dans le sous-réseau des load balancers.
# ha_vip_address: 192.0.2.10

# --- Groupes d'inventaire ----------------------------------------------------------------------
# Hôtes qui reçoivent ce rôle (au moins 2) : ils forment le groupe VRRP.
ha_peers_group: load_balancer
# Hôtes vers lesquels HAProxy répartit le trafic (les control planes).
ha_backend_group: "{{ kubernetes_control_plane_group | default('control_plane') }}"

# --- Réseau -----------------------------------------------------------------------------------
# Port d'écoute de HAProxy sur la VIP : c'est le port de kubernetes_api_endpoint.
# À changer (ex. 8443) si HAProxy est installé SUR les control planes, car kube-apiserver
# occupe déjà le port 6443 sur ces machines.
ha_bind_port: 6443
# Port de kube-apiserver sur les control planes (control_plane_bind_port).
ha_backend_port: 6443
ha_vip_prefix: 32
# Interface portant la VIP ; par défaut, celle de la route par défaut du nœud.
ha_vip_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
# Adresse de ce nœud dans le groupe VRRP.
ha_node_ip: "{{ kubernetes_node_ip | default(ansible_facts['default_ipv4']['address']) }}"

# --- Keepalived -------------------------------------------------------------------------------
# Identifiant VRRP (1-255) : unique par segment réseau.
ha_virtual_router_id: 51
# Priorité : le nœud de plus haute priorité détient la VIP. Par défaut, ordre alphabétique des hôtes.
ha_priority: "{{ 100 + (groups[ha_peers_group] | length) - (groups[ha_peers_group] | sort).index(inventory_hostname) }}"
# Mot de passe VRRP (8 caractères significatifs) ; vide = pas d'authentification.
# Valeur sensible : la stocker dans Ansible Vault.
ha_auth_pass: ""

# --- HAProxy ----------------------------------------------------------------------------------
ha_maxconn: 4096
ha_balance: roundrobin
# Délais élevés : kubectl logs -f, exec et watch sont des connexions longues.
ha_timeout_connect: 5s
ha_timeout_client: 1h
ha_timeout_server: 1h
ha_check_interval: 3s
ha_check_fall: 3
ha_check_rise: 2

# --- Pare-feu ---------------------------------------------------------------------------------
# Géré par défaut sur Rocky (firewalld actif) ; voir prerequisites_firewall_manage.
ha_firewall_manage: "{{ ansible_facts['os_family'] == 'RedHat' }}"
ha_firewall_zone: ""
