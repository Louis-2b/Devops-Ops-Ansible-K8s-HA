---
- name: Installer firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: firewall_enabled | bool
  tags: [firewall]

- name: Activer et démarrer firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: firewall_enabled | bool
  tags: [firewall]

- name: Ouvrir les ports nécessaires
  ansible.posix.firewalld:
    port: "{{ item }}"
    zone: "{{ firewall_zone | default(omit, true) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ports }}"
  when: firewall_enabled | bool
  tags: [firewall]

- name: Autoriser les services firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: "{{ firewall_zone | default(omit, true) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_services }}"
  when: firewall_enabled | bool
  tags: [firewall]

- name: Placer les réseaux du cluster dans la zone trusted
  ansible.posix.firewalld:
    source: "{{ item }}"
    zone: trusted
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_trusted_sources }}"
  when: firewall_enabled | bool
  tags: [firewall]
