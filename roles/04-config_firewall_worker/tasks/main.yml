---
- name: Copier le script config_firewall_worker.sh
  ansible.builtin.copy:
    src: config_firewall_worker.sh
    dest: /tmp/config_firewall_worker.sh
    mode: '0755'
  tags: 
    - config_firewall_worker

- name: Exécuter config_firewall_worker.sh
  ansible.builtin.command: /tmp/config_firewall_worker.sh
  tags: 
    - config_firewall_worker

- name: Supprimer le script config_firewall_worker.sh
  ansible.builtin.file:
    path: /tmp/config_firewall_worker.sh
    state: absent  
  tags: 
    - config_firewall_worker