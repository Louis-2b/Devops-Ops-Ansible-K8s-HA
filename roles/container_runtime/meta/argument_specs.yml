---
argument_specs:
  main:
    short_description: Runtime de conteneurs containerd.
    description:
      - Installe containerd.io (dépôt Docker CE, containerd 2.x) et le configure pour Kubernetes (CRI activé, cgroups systemd).
      - À appliquer sur tous les nœuds Kubernetes.
    options:
      container_runtime_version:
        type: str
        description: Version exacte de containerd.io (ex. 2.3.6) ; vide = dernière du dépôt à l'installation.
        default: ''
      container_runtime_socket:
        type: str
        description: Socket CRI utilisé par kubeadm, kubelet et crictl.
        default: unix:///run/containerd/containerd.sock
      container_runtime_sandbox_image:
        type: str
        description: Image pause (sandbox) ; vide = valeur par défaut de containerd.
        default: ''
