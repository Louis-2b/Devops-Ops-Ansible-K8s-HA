---
- name: Copier le script install_k8s_tools.sh
  ansible.builtin.copy:
    src: install_k8s_tools.sh
    dest: /tmp/install_k8s_tools.sh
    mode: "0755"
  tags:
    - install_k8s_tools

- name: Exécuter install_k8s_tools.sh
  ansible.builtin.command: /tmp/install_k8s_tools.sh
  tags:
