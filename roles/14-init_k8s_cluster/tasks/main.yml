---
- name: Copier le script init_k8s_cluster.sh
  ansible.builtin.copy:
    src: init_k8s_cluster.sh
    dest: /tmp/init_k8s_cluster.sh
    mode: "0755"
  tags:
    - init_k8s_cluster

- name: Exécuter init_k8s_cluster.sh
  ansible.builtin.command: /tmp/init_k8s_cluster.sh
  tags:
    - init_k8s_cluster

- name: Supprimer le script init_k8s_cluster.sh
  ansible.builtin.file:
    path: /tmp/init_k8s_cluster.sh
    state: absent
  tags:
    - init_k8s_cluster
