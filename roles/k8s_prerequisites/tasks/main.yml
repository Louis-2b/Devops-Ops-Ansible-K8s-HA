---
- name: Désactiver le swap immédiatement
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true
  tags: [k8s_prerequisites, swap]

- name: Commenter les entrées swap de /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'
    mode: "0644"
    backup: true
  tags: [k8s_prerequisites, swap]

- name: Configurer SELinux
  ansible.posix.selinux:
    policy: targeted
    state: "{{ k8s_selinux_state }}"
  when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
  tags: [k8s_prerequisites, selinux]

- name: Installer les paquets prérequis
  ansible.builtin.dnf:
    name: "{{ k8s_prerequisites_packages
              + (['ipvsadm'] if k8s_kube_proxy_mode == 'ipvs' else [])
              + (['nfs-utils'] if nfs_csi_enabled | bool else []) }}"
    state: present
  tags: [k8s_prerequisites, packages]

- name: Charger les modules noyau (et les rendre persistants)
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: >-
    {{ k8s_prerequisites_kernel_modules
       + (k8s_prerequisites_ipvs_modules if k8s_kube_proxy_mode == 'ipvs' else []) }}
  tags: [k8s_prerequisites, kernel]

- name: Appliquer les paramètres sysctl Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ k8s_prerequisites_sysctl | dict2items }}"
  tags: [k8s_prerequisites, sysctl]
