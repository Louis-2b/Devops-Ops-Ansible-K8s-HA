---
- name: Rechercher le répertoire personnel de l'utilisateur
  ansible.builtin.getent:
    database: passwd
    key: "{{ control_plane_kubeconfig_user }}"

- name: Créer ~/.kube
  ansible.builtin.file:
    path: "{{ getent_passwd[control_plane_kubeconfig_user][4] }}/.kube"
    state: directory
    owner: "{{ control_plane_kubeconfig_user }}"
    mode: "0700"

- name: Copier admin.conf
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ getent_passwd[control_plane_kubeconfig_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ control_plane_kubeconfig_user }}"
    mode: "0600"
