---
- name: Vérifier les paramètres du control plane
  ansible.builtin.assert:
    that:
      - kubernetes_api_endpoint is defined
      - kubernetes_api_endpoint is regex('^[^:\s]+:[0-9]{1,5}$')
      - inventory_hostname in groups[kubernetes_control_plane_group]
      - kubernetes_primary_control_plane in groups[kubernetes_control_plane_group]
      - inventory_hostname is regex('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
      - packages_kubectl | bool
    fail_msg: >-
      kubernetes_api_endpoint est obligatoire au format hôte:port ; l'hôte doit appartenir au groupe
      {{ kubernetes_control_plane_group }} ; son nom d'inventaire est le nom du nœud Kubernetes et doit
      être en minuscules (RFC 1123) ; kubectl doit être installé (packages_kubectl: true).
    quiet: true

- name: Ouvrir les ports du control plane
  ansible.posix.firewalld:
    port: "{{ control_plane_port }}"
    zone: "{{ prerequisites_firewall_zone | default(omit, true) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ control_plane_firewall_ports }}"
  loop_control:
    loop_var: control_plane_port
  when: prerequisites_firewall_manage | bool

- name: Initialiser le premier control plane
  ansible.builtin.include_tasks: primary.yml
  when: inventory_hostname == kubernetes_primary_control_plane

- name: Joindre les autres control planes
  ansible.builtin.include_tasks: secondary.yml

- name: Installer le kubeconfig de l'utilisateur d'administration
  ansible.builtin.include_tasks: kubeconfig.yml
  when: control_plane_kubeconfig_user | length > 0
