---
- name: Ajouter le dépôt Helm metrics-server
  kubernetes.core.helm_repository:
    name: metrics-server
    repo_url: "{{ metrics_server_repo_url }}"
  tags: [metrics_server]

- name: Installer ou mettre à jour metrics-server (haute disponibilité)
  kubernetes.core.helm:
    kubeconfig: "{{ metrics_server_kubeconfig }}"
    name: metrics-server
    chart_ref: metrics-server/metrics-server
    chart_version: "{{ metrics_server_chart_version }}"
    release_namespace: "{{ metrics_server_namespace }}"
    update_repo_cache: true
    wait: true
    timeout: 5m
    values: "{{ metrics_server_default_values | combine(metrics_server_extra_values, recursive=True) }}"
  vars:
    metrics_server_default_values:
      replicas: "{{ metrics_server_replicas }}"
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      args: "{{ ['--kubelet-insecure-tls'] if metrics_server_kubelet_insecure_tls | bool else [] }}"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: metrics-server
  tags: [metrics_server]

- name: Vérifier que l'API metrics est disponible
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ metrics_server_kubeconfig }}"
      - get
      - apiservice
      - v1beta1.metrics.k8s.io
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Available")].status}'
  register: metrics_server_available
  until: metrics_server_available.stdout == "True"
  retries: 18
  delay: 10
  changed_when: false
  tags: [metrics_server]
