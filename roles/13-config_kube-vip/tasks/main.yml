---
- name: Copier le script config_kube-vip.sh
  ansible.builtin.copy:
    src: config_kube-vip.sh
    dest: /tmp/config_kube-vip.sh
    mode: '0755'
  tags: 
    - config_kube-vip

- name: Exécuter config_kube-vip.sh
  ansible.builtin.command: /tmp/config_kube-vip.sh
  tags: 
    - config_kube-vip

- name: Supprimer le script config_kube-vip.sh
  ansible.builtin.file:
    path: /tmp/config_kube-vip.sh
    state: absent  
  tags: 
    - config_kube-vip