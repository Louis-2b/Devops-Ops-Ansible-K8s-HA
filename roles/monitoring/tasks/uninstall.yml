---
- name: Désinstaller la release kube-prometheus-stack
  kubernetes.core.helm:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    name: "{{ monitoring_release }}"
    release_namespace: "{{ monitoring_namespace }}"
    state: absent
    wait: true
  tags: [monitoring]

- name: Supprimer l'espace de noms de supervision
  kubernetes.core.k8s:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: absent
    wait: true
  tags: [monitoring]
