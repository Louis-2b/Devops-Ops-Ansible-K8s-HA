---
- name: Contrôler le mot de passe Grafana
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password | length >= 12
    fail_msg: >-
      monitoring_grafana_admin_password est vide ou trop court (12 caractères minimum).
      Renseignez vault_grafana_admin_password dans le vault.
    quiet: true
  tags: [monitoring]

- name: Créer l'espace de noms de supervision
  kubernetes.core.k8s:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"
  tags: [monitoring]

- name: Créer le secret des identifiants Grafana
  kubernetes.core.k8s:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ monitoring_grafana_secret }}"
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        admin-user: "{{ monitoring_grafana_admin_user }}"
        admin-password: "{{ monitoring_grafana_admin_password }}"
  no_log: true
  tags: [monitoring]

- name: Ajouter le dépôt Helm prometheus-community
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "{{ monitoring_repo_url }}"
  tags: [monitoring]

- name: Installer ou mettre à jour kube-prometheus-stack
  kubernetes.core.helm:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    name: "{{ monitoring_release }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ monitoring_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    update_repo_cache: true
    wait: true
    timeout: 15m
    values: >-
      {{ (lookup('ansible.builtin.template', 'kube-prometheus-stack-values.yaml.j2') | from_yaml)
         | combine(monitoring_extra_values, recursive=True) }}
  tags: [monitoring]

- name: Vérifier que les pods de supervision sont en cours d'exécution
  kubernetes.core.k8s_info:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
  register: monitoring_pods
  until: >-
    monitoring_pods.resources | length > 0 and
    (monitoring_pods.resources | rejectattr('status.phase', 'in', ['Running', 'Succeeded']) | list | length) == 0
  retries: 30
  delay: 10
  tags: [monitoring, verify]

- name: Récupérer l'adresse du service Grafana
  kubernetes.core.k8s_info:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    kind: Service
    namespace: "{{ monitoring_namespace }}"
    name: grafana
  register: monitoring_grafana_svc
  tags: [monitoring, verify]

- name: Afficher l'accès à Grafana
  ansible.builtin.debug:
    msg: >-
      Grafana : http://{{ monitoring_grafana_host }} (Ingress) ou
      http://{{ (monitoring_grafana_svc.resources[0].status.loadBalancer.ingress | default([{'ip': 'IP en attente'}]))[0].ip | default('IP en attente') }}
      (LoadBalancer MetalLB).
  when: monitoring_grafana_svc.resources | length > 0
  tags: [monitoring, verify]
