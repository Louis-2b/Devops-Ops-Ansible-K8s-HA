---
monitoring_state: present            # present | absent (désinstallation complète)
monitoring_chart_version: "92.2.0"
monitoring_repo_url: https://prometheus-community.github.io/helm-charts
monitoring_namespace: monitoring
monitoring_release: prometheus
monitoring_kubeconfig: /etc/kubernetes/admin.conf

monitoring_grafana_secret: grafana-admin-credentials
monitoring_grafana_admin_user: admin
# Défini dans le vault (voir inventories/production/group_vars/all/secrets.yml).
monitoring_grafana_admin_password: ""
monitoring_grafana_host: grafana.tubie.local
monitoring_grafana_ingress_class: nginx
monitoring_grafana_service_type: LoadBalancer

monitoring_prometheus_retention: 6h
monitoring_prometheus_replicas: 1
monitoring_scrape_interval: 30s
# Classe de stockage pour persister Prometheus ; vide = stockage éphémère (emptyDir).
monitoring_prometheus_storage_class: ""
monitoring_prometheus_storage_size: 20Gi

# Les composants du control plane sont scrutés via l'IP des nœuds du groupe control_plane.
monitoring_scrape_control_plane: "{{ k8s_expose_control_plane_metrics | default(true) }}"

monitoring_extra_values: {}
