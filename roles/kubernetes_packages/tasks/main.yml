---
- name: Ajouter le dépôt Kubernetes (pkgs.k8s.io)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes {{ k8s_minor_version }}
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/"
    gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/repodata/repomd.xml.key"
    # Empêche toute montée de version accidentelle lors d'un « dnf upgrade ».
    exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni
    enabled: true
  tags: [kubernetes_packages, repo]

- name: Installer kubelet, kubeadm (et kubectl) à la version demandée
  ansible.builtin.dnf:
    name: >-
      {{ ['kubelet-' ~ k8s_version, 'kubeadm-' ~ k8s_version]
         + (['kubectl-' ~ k8s_version] if k8s_install_kubectl | bool else []) }}
    state: present
    disable_excludes: kubernetes
    update_cache: true
  tags: [kubernetes_packages, packages]

- name: Activer kubelet (démarré par kubeadm init/join)
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
  tags: [kubernetes_packages, service]
