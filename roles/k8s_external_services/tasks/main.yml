---
- name: Créer les espaces de noms nécessaires
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_external_services_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: >-
    {{ (k8s_external_services | map(attribute='namespace') | list
        + k8s_external_services_secrets | map(attribute='namespace') | list) | unique | difference(['default']) }}
  tags: [k8s_external_services]

# Service sans sélecteur + EndpointSlice (l'API Endpoints est dépréciée depuis Kubernetes 1.33).
- name: Créer les services sans sélecteur
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_external_services_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      spec:
        type: ClusterIP
        ports:
          - port: "{{ item.port }}"
            targetPort: "{{ item.port }}"
            protocol: TCP
  loop: "{{ k8s_external_services }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  tags: [k8s_external_services]

- name: Associer les services à leurs adresses externes
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_external_services_kubeconfig }}"
    state: present
    definition:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
        labels:
          kubernetes.io/service-name: "{{ item.name }}"
      addressType: IPv4
      ports:
        - port: "{{ item.port }}"
          protocol: TCP
      endpoints:
        - addresses:
            - "{{ item.address }}"
  loop: "{{ k8s_external_services }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  tags: [k8s_external_services]

- name: Créer les secrets d'identifiants
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_external_services_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      type: Opaque
      stringData: "{{ item.data }}"
  loop: "{{ k8s_external_services_secrets }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  no_log: true
  tags: [k8s_external_services]
