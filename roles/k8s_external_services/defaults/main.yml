---
k8s_external_services_kubeconfig: /etc/kubernetes/admin.conf

# Services exposés dans le cluster mais hébergés hors du cluster (bases de données…).
# Chaque entrée : name, namespace, address, port
k8s_external_services: []

# Secrets associés (identifiants) : liste de {name, namespace, data: {clé: valeur}}.
# À stocker chiffrés dans le vault, jamais en clair dans le dépôt.
k8s_external_services_secrets: []
