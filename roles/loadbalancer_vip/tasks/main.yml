---
# Ressources Pacemaker : IP virtuelle + HAProxy, regroupées (même nœud, démarrage dans
# l'ordre VIP puis HAProxy), ce qui remplace colocation + order de l'ancien script.
- name: Gérer les ressources du load balancer (depuis le nœud principal)
  when: inventory_hostname == loadbalancer_vip_primary
  tags: [loadbalancer_vip]
  block:
    - name: Vérifier l'existence de la ressource IP virtuelle
      ansible.builtin.command: pcs resource config {{ loadbalancer_vip_resource }}
      register: loadbalancer_vip_vip_exists
      changed_when: false
      failed_when: false

    - name: Créer la ressource IP virtuelle
      ansible.builtin.command:
        argv:
          - pcs
          - resource
          - create
          - "{{ loadbalancer_vip_resource }}"
          - ocf:heartbeat:IPaddr2
          - "ip={{ loadbalancer_vip_address }}"
          - "cidr_netmask={{ loadbalancer_vip_netmask }}"
          - "nic={{ loadbalancer_vip_interface }}"
          - op
          - monitor
          - "interval={{ loadbalancer_vip_monitor_interval }}"
          - "timeout={{ loadbalancer_vip_monitor_timeout }}"
          - meta
          - failure-timeout=5s
          - --group
          - "{{ loadbalancer_vip_group }}"
      changed_when: true
      when: loadbalancer_vip_vip_exists.rc != 0

    - name: Vérifier l'existence de la ressource HAProxy
      ansible.builtin.command: pcs resource config {{ loadbalancer_vip_haproxy_resource }}
      register: loadbalancer_vip_haproxy_exists
      changed_when: false
      failed_when: false

    - name: Créer la ressource HAProxy
      ansible.builtin.command:
        argv:
          - pcs
          - resource
          - create
          - "{{ loadbalancer_vip_haproxy_resource }}"
          - systemd:haproxy
          - op
          - monitor
          - "interval={{ loadbalancer_vip_monitor_interval }}"
          - "timeout={{ loadbalancer_vip_monitor_timeout }}"
          - --group
          - "{{ loadbalancer_vip_group }}"
      changed_when: true
      when: loadbalancer_vip_haproxy_exists.rc != 0

    - name: Attendre que les ressources soient démarrées
      ansible.builtin.command: pcs status resources
      register: loadbalancer_vip_status
      until: >-
        loadbalancer_vip_status.stdout is search(loadbalancer_vip_resource ~ '.*Started')
        and loadbalancer_vip_status.stdout is search(loadbalancer_vip_haproxy_resource ~ '.*Started')
      retries: 12
      delay: 5
      changed_when: false

    - name: Vérifier que la VIP répond sur le port de l'API
      ansible.builtin.wait_for:
        host: "{{ loadbalancer_vip_address }}"
        port: "{{ loadbalancer_vip_port }}"
        timeout: 60
