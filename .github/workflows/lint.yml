---
name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ansible et les linters
        run: pip install ansible-core ansible-lint yamllint

      - name: Construire et installer la collection (dépendances comprises)
        run: |
          ansible-galaxy collection build --output-path /tmp/build
          ansible-galaxy collection install /tmp/build/louis2b-kubernetes-*.tar.gz

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
