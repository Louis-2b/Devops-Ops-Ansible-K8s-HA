---
# Étape 1 - socle système, pare-feu, runtime de conteneurs et paquets Kubernetes.
- name: Socle commun et pare-feu (tous les nœuds)
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common]
    - role: firewall
      tags: [firewall]

- name: Prérequis Kubernetes, containerd et kubeadm/kubelet
  hosts: k8s_cluster
  become: true
  roles:
    - role: k8s_prerequisites
      tags: [k8s_prerequisites]
    - role: containerd
      tags: [containerd]
    - role: kubernetes_packages
      tags: [kubernetes_packages]
