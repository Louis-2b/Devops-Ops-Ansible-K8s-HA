[defaults]
inventory            = inventories/production/hosts.yml
roles_path           = roles
log_path             = ./ansible.log
gathering            = smart
forks                = 10
timeout              = 30
retry_files_enabled  = False
interpreter_python   = auto_silent
callback_result_format = yaml
# Le fichier de mot de passe du vault n'est volontairement pas déclaré ici :
# utiliser --ask-vault-pass ou la variable ANSIBLE_VAULT_PASSWORD_FILE.

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
pipelining = True
# accept-new : fait confiance à la première connexion puis refuse tout changement de clé
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
