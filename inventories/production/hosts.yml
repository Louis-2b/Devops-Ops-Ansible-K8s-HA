---
# Inventaire de production.
# ⚠ Vérifiez les adresses IP : les anciens scripts du dépôt n'étaient pas cohérents
#   entre eux sur k8s1 / k8s2 (192.168.222.97 ou .98). Ici k8s1 = .98 et k8s2 = .97,
#   comme dans la configuration HAProxy et /etc/hosts d'origine.
#
# Le PREMIER hôte de `control_plane` exécute `kubeadm init` ; le PREMIER hôte de
# `haproxy_srv` pilote la configuration du cluster Pacemaker.
all:
  children:
    haproxy_srv:
      hosts:
        haproxy1:
          ansible_host: 192.168.222.93
        haproxy2:
          ansible_host: 192.168.222.94

    control_plane:
      hosts:
        k8s1:
          ansible_host: 192.168.222.98
        k8s2:
          ansible_host: 192.168.222.97
        # Recommandé en production : 3 nœuds de control plane (quorum etcd).
        # k8s3:
        #   ansible_host: 192.168.222.99

    worker_node:
      hosts:
        node1:
          ansible_host: 192.168.222.95

    k8s_cluster:
      children:
        control_plane:
        worker_node:
