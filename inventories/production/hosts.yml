---
# Inventaire de production (exemple à adapter à vos VM).
#
# Plan d'adressage retenu (réseau 192.168.222.0/24) :
#   .11-.12   load balancers (haproxy1/2)      .20  VIP de l'API (k8s_control_plane_vip)
#   .31-.33   control planes (k8s1..3)         .51-.52  workers (node1/2)
#   .100-.150 pool MetalLB                     .40 NFS, .45 bases de données externes
# Remplacez uniquement les `ansible_host` ; les noms d'hôtes servent aussi de noms de nœuds Kubernetes.
#
# Le PREMIER hôte de `control_plane` exécute `kubeadm init` ; le PREMIER hôte de
# `haproxy_srv` pilote la configuration du cluster Pacemaker. Gardez-les en tête de liste.
all:
  children:
    haproxy_srv:
      hosts:
        haproxy1:
          ansible_host: 192.168.222.11
        haproxy2:
          ansible_host: 192.168.222.12

    control_plane:
      hosts:
        k8s1:
          ansible_host: 192.168.222.31
        k8s2:
          ansible_host: 192.168.222.32
        k8s3:
          ansible_host: 192.168.222.33

    worker_node:
      hosts:
        node1:
          ansible_host: 192.168.222.51
        node2:
          ansible_host: 192.168.222.52

    k8s_cluster:
      children:
        control_plane:
        worker_node:
