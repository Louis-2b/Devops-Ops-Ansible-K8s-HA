---
# Comptes et droits Kubernetes (rôle k8s_rbac).
# Reprend les exemples des anciens scripts rbac/*.sh : utilisateur « bienvenue »
# (groupe infra) et compte de service « gitlab » pour le CI/CD.

k8s_rbac_cluster_roles:
  - name: infra-cr
    rules:
      - apiGroups: [""]
        resources: [pods, services]
        verbs: ["*"]
      - apiGroups: [apps]
        resources: [deployments, statefulsets]
        verbs: [get, list, create]

k8s_rbac_users:
  - name: bienvenue
    group: infra
    validity_days: 100          # 8640000 s dans l'ancien script
    cluster_role: infra-cr
    cluster_role_binding: infra-crb

k8s_rbac_service_accounts:
  - name: gitlab
    namespace: default
    token_secret: gitlab-token
    roles:
      - name: gitlab-cicd-role
        binding: gitlab-cicd-rolebinding
        rules:
          - apiGroups: [""]
            resources: [services]
            verbs: [create, update, list]
          - apiGroups: [apps]
            resources: [deployments]
            verbs: [create, update, list]
