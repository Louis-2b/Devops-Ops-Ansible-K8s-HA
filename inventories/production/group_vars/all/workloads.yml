---
# Stockage NFS (rôle nfs_csi, activé avec nfs_csi_enabled: true)
nfs_csi_chart_version: "v4.13.5"
nfs_csi_storage_class:
  name: nfs-csi
  server: 192.168.222.40
  share: /srv/nfs/kubedata
  reclaim_policy: Retain
  mount_options:
    - nfsvers=4

# Bases de données externes exposées dans le cluster (rôle k8s_external_services,
# activé avec k8s_external_services_enabled: true). Les identifiants sont dans
# vault.yml (vault_k8s_secrets).
k8s_external_services:
  - name: mongo-external
    namespace: default
    address: 192.168.222.45
    port: 27017
  - name: mysql-external
    namespace: default
    address: 192.168.222.45
    port: 3306
  - name: postgres-external
    namespace: development
    address: 192.168.222.45
    port: 5432

# Monitoring
monitoring_grafana_host: grafana.tubie.local
