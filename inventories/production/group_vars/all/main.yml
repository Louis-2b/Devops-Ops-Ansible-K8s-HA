---
# ============================================================================
# Variables communes à tout le cluster
# Les secrets sont dans vault.yml (chiffré avec ansible-vault), jamais ici.
# ============================================================================

# --- Connexion ---------------------------------------------------------------
# Compte de service Ansible créé par playbooks/00-bootstrap.yml
ansible_automation_user: ansible
ansible_user: "{{ ansible_automation_user }}"
ansible_automation_key: ~/.ssh/ansible   # clé privée d'Ansible (générée par 00-bootstrap)
ansible_ssh_private_key_file: "{{ ansible_automation_key }}"

# Environnement Python (sur le premier control plane) utilisé par les modules
# kubernetes.core ; créé par le rôle k8s_tooling.
k8s_tooling_venv: /opt/ansible-k8s-venv

# --- Système (rôle common) ---------------------------------------------------
common_timezone: ""                      # ex. Europe/Paris ; vide = inchangé
common_upgrade_packages: false           # dnf upgrade complet (+ reboot si nécessaire)
common_reboot_if_required: false
common_ssh_password_authentication: false  # durcissement SSH : clés uniquement

# --- Kubernetes --------------------------------------------------------------
k8s_cluster_name: kubernetes
k8s_version: "1.36.5"                    # version exacte de kubelet/kubeadm/kubectl
k8s_minor_version: "{{ k8s_version.split('.')[:2] | join('.') }}"
k8s_pod_cidr: 10.244.0.0/16              # doit correspondre au réseau Flannel
k8s_service_cidr: 10.96.0.0/12
k8s_kube_proxy_mode: iptables            # iptables | nftables | ipvs
k8s_selinux_state: permissive            # permissive | enforcing (voir README)
k8s_apiserver_enable_aggregator_routing: true   # requis par metrics-server en HA
# Certificats de service du kubelet signés par le cluster (metrics-server sans
# --kubelet-insecure-tls) ; les CSR sont approuvées par le rôle k8s_post_install.
k8s_kubelet_serving_cert_bootstrap: true

# Premier nœud du control plane (ordre alphabétique, donc stable même avec un inventaire
# dynamique) : exécute kubeadm init et les addons.
k8s_first_control_plane: "{{ groups['control_plane'] | sort | first }}"

# --- Point d'entrée haute disponibilité du control plane ---------------------
k8s_control_plane_vip: 192.168.222.20
k8s_control_plane_port: 6443
k8s_control_plane_endpoint: "{{ k8s_control_plane_vip }}:{{ k8s_control_plane_port }}"
k8s_api_hostname: kube-vip               # alias ajouté à /etc/hosts
# Interface portant la VIP : détectée automatiquement (interface de la route par défaut).
# Forcez-la (ex. ens160) si les load balancers ont plusieurs cartes réseau.
k8s_vip_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
k8s_vip_netmask: 24

# --- Métriques (Prometheus) --------------------------------------------------
# Expose les ports de métriques etcd/scheduler/controller-manager/kube-proxy
# sur les nœuds control plane (nécessaire pour kube-prometheus-stack).
k8s_expose_control_plane_metrics: true

# --- Composants additionnels (versions épinglées) ----------------------------
cni_flannel_version: "v0.28.10"
metallb_version: "v0.16.1"
metallb_ip_range: 192.168.222.100-192.168.222.150
ingress_nginx_chart_version: "4.15.1"
metrics_server_chart_version: "3.14.0"
monitoring_chart_version: "92.2.0"
k8s_tooling_helm_version: "v3.21.4"

# --- Activation des addons (playbooks/04-addons.yml) --------------------------
metallb_enabled: true
ingress_nginx_enabled: true
metrics_server_enabled: true
monitoring_enabled: true
nfs_csi_enabled: false
k8s_rbac_enabled: true
k8s_external_services_enabled: false
