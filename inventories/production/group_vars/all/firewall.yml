---
# Ports ouverts (firewalld) par type de nœud.
# Référence : https://kubernetes.io/docs/reference/networking/ports-and-protocols/

firewall_ports_k8s_common:
  - 10250/tcp          # API kubelet
  - 8472/udp           # Flannel VXLAN
  - 7946/tcp           # MetalLB (memberlist)
  - 7946/udp
  - 30000-32767/tcp    # Services NodePort

firewall_ports_control_plane:
  - 6443/tcp           # API Kubernetes
  - 2379-2380/tcp      # etcd (client / pairs)
  - 10257/tcp          # kube-controller-manager
  - 10259/tcp          # kube-scheduler

# Ports de métriques, ouverts seulement si k8s_expose_control_plane_metrics est vrai
firewall_ports_control_plane_metrics:
  - 2381/tcp           # etcd (métriques)
  - 10249/tcp          # kube-proxy (métriques)

# Le trafic pods/services du cluster est considéré comme fiable.
firewall_trusted_sources_k8s:
  - "{{ k8s_pod_cidr }}"
  - "{{ k8s_service_cidr }}"
